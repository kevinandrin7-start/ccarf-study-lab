<title>CCAR-F Study Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7">
<style>
  /* Layout: iOS-style single column (max 640px), grouped inset lists, large titles, translucent tab bar. */
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --fill: rgba(120,120,128,0.12); --sep: rgba(60,60,67,0.29);
    --label: #000000; --label2: rgba(60,60,67,0.6); --label3: rgba(60,60,67,0.3);
    --blue-rgb: 0 122 255; --green-rgb: 52 199 89; --red-rgb: 255 59 48; --orange-rgb: 255 149 0; --yellow-rgb: 255 204 0;
    --blue: rgb(var(--blue-rgb)); --green: rgb(var(--green-rgb)); --red: rgb(var(--red-rgb)); --orange: rgb(var(--orange-rgb));
    --bar: rgba(249,249,249,0.86);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,0.24); --sep: rgba(84,84,88,0.65);
      --label: #FFFFFF; --label2: rgba(235,235,245,0.6); --label3: rgba(235,235,245,0.3);
      --blue-rgb: 10 132 255; --green-rgb: 48 209 88; --red-rgb: 255 69 58; --orange-rgb: 255 159 10; --yellow-rgb: 255 214 10;
      --bar: rgba(22,22,24,0.82); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --card: #1C1C1E; --fill: rgba(118,118,128,0.24); --sep: rgba(84,84,88,0.65);
    --label: #FFFFFF; --label2: rgba(235,235,245,0.6); --label3: rgba(235,235,245,0.3);
    --blue-rgb: 10 132 255; --green-rgb: 48 209 88; --red-rgb: 255 69 58; --orange-rgb: 255 159 10; --yellow-rgb: 255 214 10;
    --bar: rgba(22,22,24,0.82); color-scheme: dark;
  }
  html, body { min-height: 100%; }
  body { background: var(--bg); color: var(--label); font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .navbar { top: env(safe-area-inset-top, 0px); background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .tabbar { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  .sheet { padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0 } to { transform: none; opacity: 1 } }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .boot { display: flex; min-height: 60vh; align-items: center; justify-content: center; color: var(--label2); font: 15px var(--font); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
