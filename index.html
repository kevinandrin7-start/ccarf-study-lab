0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3",key:"wmoenq"}],["path",{d:"M12 9v4",key:"juzpu7"}],["path",{d:"M12 17h.01",key:"p32p05"}]]);var he=f("Trophy",[["path",{d:"M6 9H4.5a2.5 2.5 0 0 1 0-5H6",key:"17hqa7"}],["path",{d:"M18 9h1.5a2.5 2.5 0 0 0 0-5H18",key:"lmptdp"}],["path",{d:"M4 22h16",key:"57wxv0"}],["path",{d:"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22",key:"1nw9bq"}],["path",{d:"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22",key:"1np0yb"}],["path",{d:"M18 2H6v7a6 6 0 0 0 12 0V2Z",key:"u46fv3"}]]);var me=f("Wrench",[["path",{d:"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z",key:"cbrjhi"}]]);var G=f("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]);var Ke=[["Questions","60 multiple choice"],["Time","120 minutes"],["Passing score","720 out of 1,000"],["Scenarios","4 picked at random from 6"],["Guessing","No penalty, so answer everything"]],qe=[["Customer support agent","An agent that answers customers, uses tools to look things up, and knows when to hand off to a person."],["Code generation with Claude Code","Writing, fixing and explaining code using CLAUDE.md, commands and plan mode."],["Multi-agent research system","A lead agent that sends helper agents to search and read, then writes a report with sources."],["Developer productivity","Exploring an unfamiliar codebase and generating code with built-in tools and MCP servers."],["Claude Code in CI/CD","Automatic code reviews and tests that run on every pull request."],["Structured data extraction","Pulling clean data out of messy documents and checking it against a schema."]],N=[{id:"agentic",name:"Agentic Architecture",full:"Agentic Architecture & Orchestration",weight:27,color:"#007AFF",icon:"Network",intro:"How AI agents work in a loop, team up with helper agents, and follow rules that can't be skipped."},{id:"claudecode",name:"Claude Code",full:"Claude Code Configuration & Workflows",weight:20,color:"#AF52DE",icon:"Terminal",intro:"How to set up Claude Code with memory files, commands, skills and rules, and use it in automated pipelines."},{id:"prompting",name:"Prompts & Output",full:"Prompt Engineering & Structured Output",weight:20,color:"#34C759",icon:"MessageSquareText",intro:"How to give clear instructions, show good examples, and get clean data back every time."},{id:"tools",name:"Tools & MCP",full:"Tool Design & MCP Integration",weight:18,color:"#FF9500",icon:"Wrench",intro:"How to describe tools so Claude picks the right one, report errors well, and connect MCP servers."},{id:"context",name:"Context & Reliability",full:"Context Management & Reliability",weight:15,color:"#30B0C7",icon:"ShieldCheck",intro:"How to keep important facts in view, hand off to people at the right time, and show where answers came from."}],P=[{id:"1.1",domain:"agentic",title:"The agent loop",simple:"An agent is Claude working in a loop. Claude asks to use a tool, your code runs the tool, you hand back the result, and Claude decides what to do next. This repeats until the job is done.",analogy:"It's like a chef following a recipe. Read a step, do it, check the result, read the next step. The chef stops when the dish is finished, not after a fixed number of steps.",points:["Look at `stop_reason` in each response. If it is `tool_use`, run the tool and keep looping.","If it is `end_turn`, Claude is finished. Stop the loop.","Add each tool result to the conversation history, so Claude remembers what it already learned.","Don't decide 'done' by searching Claude's text for words like 'finished'. Use `stop_reason`.","A maximum number of loops is a safety net, not the main way to stop."],example:"A support agent calls `get_customer`, then `lookup_order`, then replies to the customer. Your code keeps looping while `stop_reason` is `tool_use` and stops at `end_turn`.",remember:"Loop on tool_use. Stop on end_turn.",check:{q:"How should your code know the agent is finished?",options:["The reply contains the word 'done'","stop_reason is end_turn","It has looped 10 times"],answer:1,why:"stop_reason is the official signal. Text checks and loop counts are unreliable."}},{id:"1.2",domain:"agentic",title:"Coordinator and helper agents",simple:"For big jobs, one lead agent (the coordinator) splits the work and sends pieces to helper agents (subagents). Each helper does its part and reports back, and the coordinator puts the answers together.",analogy:"Think of a group project. The team leader hands out tasks, each person researches their part, and the leader combines everything into the final report.",points:["This is called hub-and-spoke: all communication goes through the coordinator.","Helpers do NOT see the coordinator's conversation. They only know what you put in their instructions.","The coordinator decides which helpers to use based on the question, rather than always running every helper.","Splitting work too narrowly is a common mistake. If a research topic is cut into tiny pieces, important parts can be missed entirely."],example:"A research coordinator asked about 'AI in creative industries' sends one helper to search, one to read documents and one to write the summary, and makes sure the topic slices cover music, film and art, not just one of them.",remember:"The coordinator plans, delegates and combines. Helpers start with a blank memory.",check:{q:"A research report keeps missing whole subtopics. What is the likely cause?",options:["The coordinator split the topic too narrowly","The helpers are too fast","The report is too long"],answer:0,why:"When the coordinator's breakdown leaves areas out, no helper ever looks at them."}},{id:"1.3",domain:"agentic",title:"Giving helpers what they need",simple:"Because helper agents start with a blank memory, the coordinator must give each one everything it needs: the goal, the facts found so far, and any limits.",analogy:"It's like leaving a note for a babysitter. They can't read your mind, so you write down bedtime, allergies and your phone number.",points:["In the Agent SDK, helpers are started with the `Task` tool. The coordinator's `allowedTools` must include `Task`.","Pass findings from earlier steps directly in the helper's prompt, with sources attached.","To run helpers at the same time, ask for several `Task` calls in one response instead of one per turn.","Give each helper its own description, instructions and tool list (an `AgentDefinition`).","Use `fork_session` to try two different approaches from the same starting point."],example:"Before sending a 'write the summary' helper off, the coordinator includes the search results and document notes in its prompt, with each fact's source URL.",remember:"Helpers only know what you tell them. Write it down for them.",check:{q:"How do you make three helpers run at the same time?",options:["Start one helper per turn","Request three Task calls in a single response","Give one helper three times the tools"],answer:1,why:"Several Task calls in one response run in parallel."}},{id:"1.4",domain:"agentic",title:"Rules the agent can't skip",simple:"Some rules must always be followed, like 'check who the customer is before giving a refund'. A sentence in the prompt usually works, but 'usually' isn't good enough for money or safety. Enforce those rules in code.",analogy:"A sign saying 'please don't run' helps. A locked gate stops people for sure. For important rules, build the gate.",points:["Prompt instructions are probabilistic: followed most of the time, not every time.","Code checks (programmatic gates) are deterministic: they always run.","Example gate: block `process_refund` until `get_customer` has returned a verified ID.","When an agent hands off to a person, send a short structured summary: customer ID, the problem, what was tried, and what's recommended."],example:"Logs show the agent skipped identity checks in 12% of refunds. The fix is a code check that blocks refunds until verification passes, not a stronger prompt.",remember:"Must-follow rules belong in code, not just in the prompt.",check:{q:"An agent sometimes skips a required check. What is the most reliable fix?",options:["Write the rule in capital letters","Add a code gate that blocks the next step until the check passes","Add more examples"],answer:1,why:"Only code guarantees the rule is followed every time."}},{id:"1.5",domain:"agentic",title:"Hooks",simple:"Hooks are small pieces of your code that run automatically before or after Claude uses a tool. They let you block bad actions or tidy up results.",analogy:"A hook is like a security guard at a door. Before anyone enters, the guard checks their badge. After a delivery arrives, someone unpacks it and puts things where they belong.",points:["A pre-tool hook (`PreToolUse`) runs before a tool call. It can block it, for example refunds over $500, and send the case to a person instead.","A post-tool hook (`PostToolUse`) runs after a tool call. It can clean the result, for example turning three different date formats into one.","Hooks are deterministic: they run every time, unlike prompt instructions."],example:"Different backend tools return dates as Unix timestamps, '2026-03-04' and 'March 4'. A PostToolUse hook converts them all to one format before Claude sees them.",remember:"Before the tool: block. After the tool: clean up.",check:{q:"You must stop all refunds above $500. Where should that rule live?",options:["A PreToolUse hook","A friendly line in the system prompt","A PostToolUse hook"],answer:0,why:"A pre-tool hook can block the call before it happens, every time."}},{id:"1.6",domain:"agentic",title:"Breaking big jobs into steps",simple:"There are two ways to split a big task. If the steps are known in advance, use a fixed chain of steps. If you don't know what you'll find, let the agent plan as it goes.",analogy:"Baking a cake follows a fixed recipe. Exploring a new city means deciding the next stop after seeing what's around you.",points:["Prompt chaining (fixed steps) suits predictable work, such as reviewing every file the same way.","Adaptive decomposition suits open-ended work, such as investigating a bug or adding tests to old code.","For big code reviews, review each file on its own first, then do one extra pass that looks at how files connect.","Reviewing 14 files in one giant pass gives uneven, shallow results."],example:"A pull request touches 14 files. Run a focused review per file, then one integration pass to catch problems that cross file boundaries.",remember:"Known steps: chain them. Unknown territory: adapt as you go.",check:{q:"A 14-file pull request gets shallow reviews. What helps most?",options:["Review all files in one bigger prompt","Review each file separately, then do one cross-file pass","Only review the first file"],answer:1,why:"Focused passes plus one integration pass give deeper, more consistent reviews."}},{id:"1.7",domain:"agentic",title:"Saving and resuming work",simple:"Long tasks can be paused and picked up later. You can resume the old session, branch off a copy to try something different, or start fresh with a short summary.",analogy:"Like a video game: continue from your save, make a second save to try a risky path, or start a new game with notes on what you learned.",points:["`--resume <session-name>` continues a named session where it left off.","`fork_session` makes a branch, so you can explore two approaches from the same point.","If files have changed since the last session, tell the resumed session exactly which files changed.","If old tool results are now out of date, a fresh session with a written summary is often better than resuming."],example:"After a day off, half the code an investigation looked at has been rewritten. Starting a new session with a summary of key findings avoids reasoning from stale data.",remember:"Resume when things are still true. Start fresh with a summary when they're not.",check:{q:"Most of the files an old session read have changed. What should you do?",options:["Resume and hope","Start a new session with a summary of what was learned","Delete everything"],answer:1,why:"Stale tool results mislead. A fresh start with a summary keeps the useful knowledge."}},{id:"2.1",domain:"tools",title:"Describing tools well",simple:"Claude chooses tools by reading their descriptions. Vague or overlapping descriptions lead to wrong choices. Clear descriptions lead to right ones.",analogy:"Imagine two drawers both labelled 'stuff'. You'd guess wrong half the time. Label them 'batteries' and 'birthday candles' and you'd never mix them up.",points:["Say what the tool does, what it needs, what it returns, and when to use it instead of a similar tool.","Include example inputs and edge cases.","If two tools overlap, rename or split them: for example `extract_web_results` instead of a generic `analyze_content`.","Check the system prompt too. A phrase like 'always check the customer first' can push Claude toward the wrong tool."],example:"`get_customer` and `lookup_order` both say 'Retrieves information'. Claude keeps calling the wrong one. Rewriting both descriptions to say exactly what each accepts and returns fixes it.",remember:"The description is the tool's label. Make it impossible to confuse.",check:{q:"Claude keeps mixing up two similar tools. What should you fix first?",options:["The tool descriptions","The model","The tool order"],answer:0,why:"Descriptions are the main thing Claude uses to choose a tool."}},{id:"2.2",domain:"tools",title:"Helpful error messages",simple:"When a tool fails, tell Claude what kind of failure it was and whether trying again could help. A plain 'Operation failed' leaves Claude guessing.",analogy:"'The shop is closed until 9am' is more useful than 'Error'. You know to wait and come back.",points:["Mark failures with `isError: true` in the MCP tool result.","Name the type: transient (a timeout, worth retrying), validation (bad input, fix it), business (a policy says no, don't retry), or permission (not allowed).","Add `isRetryable` and a short, friendly explanation.","An empty result is not an error. 'No matching orders' is a successful search that found nothing. Keep the two clearly different."],example:'A refund over the policy limit returns `isError: true`, `errorCategory: "business"`, `isRetryable: false`, and a message Claude can pass on to the customer.',remember:"Say what went wrong and whether to try again.",check:{q:"A search finds zero matching orders. How should the tool report it?",options:["As an error","As a successful result with no matches","Return nothing at all"],answer:1,why:"No matches is a valid answer. Calling it an error causes pointless retries."}},{id:"2.3",domain:"tools",title:"How many tools, and tool_choice",simple:"Giving an agent too many tools makes it choose badly. Give each agent only the tools its job needs. Use `tool_choice` to say whether Claude may, must, or must use one particular tool.",analogy:"A plumber's van holds plumbing tools, not every tool in the hardware store. Fewer, better-matched tools mean faster, surer choices.",points:["Around 4 to 5 well-matched tools per agent works far better than 18.","A helper agent should not get tools outside its role. A search helper doesn't need a 'send email' tool.",'`tool_choice: "auto"`: Claude may answer in text or call a tool.','`"any"`: Claude must call some tool. `{"type": "tool", "name": ...}`: Claude must call that exact tool.',"Note: the newest models (Opus 5.5, Sonnet 5.5, Fable 5.1) reject forced `any` and `tool`. There, use `auto` plus a clear instruction, and `strict: true` on the tool."],example:'To make sure an extraction step always returns data instead of chatting, older setups used `tool_choice: "any"` with the extraction tool.',remember:"Few tools per agent. auto = may, any = must, tool = this one.",check:{q:"Which tool_choice means Claude must call some tool but can pick which?",options:["auto","any","none"],answer:1,why:'"any" forces a tool call but leaves the choice of tool to Claude.'}},{id:"2.4",domain:"tools",title:"Connecting MCP servers",simple:"MCP (Model Context Protocol) is a standard way to plug outside tools and data, such as GitHub, Jira or a database, into Claude. You list servers in a config file.",analogy:"MCP is like a USB port. Any device that uses the standard plug works, without custom wiring for each one.",points:["Project servers go in `.mcp.json` in the project folder. It's shared with the team through version control.","Personal servers go in `~/.claude.json` in your home folder. Only you get them.","Never put secrets in `.mcp.json`. Use environment variables, such as `${GITHUB_TOKEN}`.","MCP resources give Claude a catalogue of available content (like a list of issues), so it doesn't waste calls exploring.","Prefer an existing community MCP server over building your own for standard services."],example:"The team's shared Jira server goes in `.mcp.json` with `${JIRA_TOKEN}`. Your personal experimental server goes in `~/.claude.json`.",remember:"Team: .mcp.json. Just me: ~/.claude.json. Secrets: ${ENV_VARS}.",check:{q:"Where should a server the whole team needs be configured?",options:["~/.claude.json",".mcp.json in the project","In the system prompt"],answer:1,why:".mcp.json lives in the project and is shared with everyone."}},{id:"2.5",domain:"tools",title:"Claude Code's built-in tools",simple:"Claude Code has built-in tools for working with files. Picking the right one saves time and avoids mistakes.",analogy:"Glob is like searching your computer by file name. Grep is like using Find to search inside documents.",points:["Grep searches file contents, for example 'find every place that calls `processPayment`'.","Glob finds files by name pattern, for example `**/*.test.tsx`.","Read opens a whole file. Write creates or replaces a whole file.","Edit changes one exact piece of text. It needs that text to be unique in the file.","If Edit fails because the text appears more than once, Read the file and Write the full new version, or include more surrounding text.","Explore step by step: find entry points with Grep, then Read only what you need."],example:"To find all test files, use Glob with `**/*.test.*`. To find who calls a function, use Grep with its name.",remember:"Glob = names. Grep = contents. Edit = small change. Write = whole file.",check:{q:"You need every file whose name ends in .test.tsx. Which tool?",options:["Grep","Glob","Edit"],answer:1,why:"Glob matches file names and paths."}},{id:"3.1",domain:"claudecode",title:"CLAUDE.md memory files",simple:"CLAUDE.md is a note file that Claude Code reads automatically. It holds your project's rules and habits, like 'we use tabs' or 'run tests with npm test'.",analogy:"It's like the rules poster on a classroom wall. Everyone who walks in sees it, so you don't repeat it every day.",points:["User level: `~/.claude/CLAUDE.md` is just for you and is NOT shared with your team.","Project level: `CLAUDE.md` or `.claude/CLAUDE.md` in the repo is shared with everyone through version control.","Folder level: a `CLAUDE.md` inside a subfolder applies when working there.","Use `@path/to/file` to import other files, keeping CLAUDE.md short and organised.","Run `/memory` to see which memory files are loaded. It's the first step when Claude seems to ignore a rule."],example:"A new teammate's Claude ignores the coding standards. The rules were in the original developer's `~/.claude/CLAUDE.md`, not the project's. Move them to the project CLAUDE.md.",remember:"Team rules go in the project CLAUDE.md, not your personal one.",check:{q:"A teammate's Claude doesn't follow rules that work for you. Most likely cause?",options:["The rules are in your user-level CLAUDE.md","Their computer is slower","They use a different font"],answer:0,why:"User-level memory isn't shared. Team rules belong in the project file."}},{id:"3.2",domain:"claudecode",title:"Slash commands and skills",simple:"Slash commands and skills are reusable instructions you can run with a short name, like `/review`. Skills are folders with a `SKILL.md` file that Claude can use when they fit the task.",analogy:"Like speed-dial on a phone: save the long number once, then press one button.",points:["Team commands: `.claude/commands/` in the project (shared). Personal commands: `~/.claude/commands/`.","Skills live in `.claude/skills/<name>/SKILL.md` (project) or `~/.claude/skills/` (personal).","SKILL.md frontmatter options: `context: fork` runs the skill in its own separate context so its long output doesn't clutter your conversation.","`allowed-tools` limits which tools the skill may use. `argument-hint` tells people what to type after the command.","Use CLAUDE.md for rules that always apply. Use skills for tasks you run on demand."],example:"A `/review` command in `.claude/commands/review.md` gives every developer on the team the same review checklist.",remember:"Shared: in the project's .claude folder. Personal: in ~/.claude.",check:{q:"A skill produces a long, noisy output. Which setting keeps your main conversation clean?",options:["context: fork","argument-hint","Putting it in CLAUDE.md"],answer:0,why:"context: fork runs the skill in a separate context."}},{id:"3.3",domain:"claudecode",title:"Rules for certain files",simple:"Some rules only matter for certain files, like 'test files use this style'. Put them in `.claude/rules/` with a `paths` pattern, and Claude loads them only when it touches matching files.",analogy:"Like a 'lab coat required' sign that only appears on the science room door, not on every door in the school.",points:['Each rules file has YAML frontmatter, for example `paths: ["**/*.test.tsx"]`.',"The rule loads only when matching files are being edited, saving context and avoiding confusion.","This beats folder-level CLAUDE.md when the files are spread across many folders, like tests living next to the code they test."],example:'Test files sit all over the codebase. One `.claude/rules/testing.md` with `paths: ["**/*.test.*"]` covers them all.',remember:"Rules for scattered files: .claude/rules with paths.",check:{q:"Test files are spread across 50 folders. Best way to give them a style rule?",options:["A CLAUDE.md in each of the 50 folders","One .claude/rules file with a paths glob","Repeat the rule in every prompt"],answer:1,why:"A path-scoped rule matches them wherever they live."}},{id:"3.4",domain:"claudecode",title:"Plan mode or just do it?",simple:"For big or unclear changes, ask Claude to plan first and show you before touching code. For small, clear fixes, let it go straight ahead.",analogy:"You draw a plan before building a treehouse. You don't draw a plan to tighten one screw.",points:["Use plan mode for changes across many files, architecture decisions, or when there are several possible approaches.","Use direct execution for small, well-defined changes, like fixing one function.","A common pattern: plan first, then execute the approved plan.","The Explore subagent can do the noisy searching, keeping your main conversation tidy."],example:"Moving a whole app from one framework to another touches 45 files: plan mode. Fixing a typo in an error message: just do it.",remember:"Big or unclear: plan first. Small and clear: just do it.",check:{q:"A change will touch 45 files and could be done several ways. What should you use?",options:["Direct execution","Plan mode","Skip it"],answer:1,why:"Large, multi-option changes benefit from an agreed plan first."}},{id:"3.5",domain:"claudecode",title:"Improving results step by step",simple:"If Claude's first result isn't quite right, show it exactly what you want instead of describing it again in different words.",analogy:"Saying 'make it nicer' is vague. Showing a picture of the cake you want works much better.",points:["Give 2 to 3 concrete examples of input and the exact output you want.","Write tests first, then let Claude improve the code until the tests pass.","Interview pattern: ask Claude to ask YOU questions before it starts, so hidden assumptions come out.","Fix problems that affect each other together in one message. Fix unrelated problems one at a time."],example:"A data converter keeps getting edge cases wrong. Two examples showing the exact input and expected output fix it faster than a longer description.",remember:"Show, don't just tell. Tests make 'done' clear.",check:{q:"Claude keeps misunderstanding a format you described in words. Best next step?",options:["Describe it again more loudly","Show 2 to 3 input and output examples","Switch tasks"],answer:1,why:"Concrete examples remove the guesswork."}},{id:"3.6",domain:"claudecode",title:"Claude Code in CI/CD",simple:"Claude Code can run automatically in pipelines, for example reviewing every pull request. In a pipeline nobody is there to type, so it must run non-interactively.",analogy:"It's like setting a washing machine on a timer. It must start and finish by itself, without waiting for someone to press a button.",points:['Use `claude -p "..."` (print mode). Without `-p`, Claude Code waits for input and the job hangs.',"Add `--output-format json` and `--json-schema` so other tools can read the result.","The project CLAUDE.md gives the pipeline the same rules and context as developers.","Pass in previous review comments so Claude doesn't repeat feedback it already gave.","A separate, fresh Claude session reviews code better than the session that wrote it."],example:'A pipeline step runs `claude -p "Review this PR" --output-format json` and posts each finding as an inline comment.',remember:"Pipelines need -p. Machines need JSON.",check:{q:"A CI job running Claude Code hangs forever. What's missing?",options:["The -p flag","A bigger server","More memory files"],answer:0,why:"Without -p, Claude Code waits for someone to type."}},{id:"4.1",domain:"prompting",title:"Clear, specific instructions",simple:"Vague instructions like 'be careful' or 'only report important issues' mean different things to different readers. Spell out exactly what counts and what doesn't.",analogy:"'Clean your room' leads to arguments. 'Clothes in the drawer, books on the shelf, bin emptied' gets the job done.",points:["Name the categories you want: 'report bugs and security problems; skip style and naming'.","Explain what each severity level means, with an example for each.","Too many false alarms make people stop trusting every finding, even the real ones.","If one category produces lots of false alarms, switch it off for now and improve its instructions."],example:"A code reviewer flags too many harmless things. Replacing 'be conservative' with 'only flag comments that contradict what the code actually does' cuts the noise.",remember:"Say exactly what to report and what to skip.",check:{q:"A reviewer gives too many false alarms. Which change helps most?",options:["'Be more conservative'","List exactly which issues to report and which to skip","Ask for more findings"],answer:1,why:"Specific criteria beat vague tone instructions."}},{id:"4.2",domain:"prompting",title:"Learning from examples",simple:"Showing a few examples of good answers (few-shot prompting) is the best way to get consistent results, especially for tricky, borderline cases.",analogy:"A teacher who solves two example problems on the board helps more than one who only explains the rules.",points:["Use about 2 to 4 targeted examples.","Pick examples for the cases that are hard to call, not just easy ones.","Show the reasoning: why this case gets this answer and not another.","Examples also lock in the exact output format you want."],example:"An extractor handles normal invoices well but misreads ones with handwritten notes. Adding two examples of annotated invoices, with the right output, fixes it.",remember:"2 to 4 examples, aimed at the tricky cases.",check:{q:"Which examples help most in a few-shot prompt?",options:["Ten easy, typical cases","Two to four tricky, borderline cases with reasoning","No examples, just rules"],answer:1,why:"Targeted examples teach the hard judgment calls."}},{id:"4.3",domain:"prompting",title:"Getting clean structured data",simple:"To get data a program can use, give Claude a JSON schema, a description of exactly which fields to fill. Schemas guarantee the shape is right, but not that the values are right.",analogy:"A form with boxes makes sure every answer is in the right box. It doesn't stop someone writing the wrong number in the box.",points:["Define the output as a tool `input_schema` (or use structured outputs). This prevents broken JSON.","Make a field nullable (allowed to be empty) if the information might be missing. Otherwise Claude may make something up to fill it.",'For category fields, add `"other"` (with a details field) and `"unclear"`, so odd cases have somewhere honest to go.',"A strict schema stops format errors, not meaning errors. Line items might still not add up to the total."],example:"Some invoices have no due date. Making `due_date` nullable stops Claude inventing one.",remember:"Schema fixes the shape. Nullable fields stop made-up values.",check:{q:"Claude invents dates for invoices that don't have one. What fixes this?",options:["Make the date field nullable","Remove the schema","Ask it to try harder"],answer:0,why:"If null is allowed, Claude doesn't need to invent a value."}},{id:"4.4",domain:"prompting",title:"Check and retry",simple:"After Claude extracts data, check it with code. If something's wrong, send it back with the specific mistake so Claude can fix it. But retrying can't find information that isn't there.",analogy:"A teacher who writes 'line 3 doesn't add up' gets a better correction than one who writes 'wrong, try again'.",points:["Retry with three things: the original document, the failed answer, and the exact error.","Retries help with format or reading mistakes. They don't help when the data is missing from the source.","Add self-check fields, like `calculated_total` next to `stated_total`, so mismatches are easy to spot.","Track which kind of mistake is happening (for example a `detected_pattern` field) so you can fix the cause."],example:"Line items add up to $940 but the stated total is $1,000. Code catches it and asks Claude to re-check, quoting both numbers.",remember:"Retry with the specific error. Missing data can't be retried into existence.",check:{q:"When will retrying an extraction NOT help?",options:["The date was in the wrong format","The information isn't in the document at all","A field name was misspelled"],answer:1,why:"No amount of retrying can find what isn't there."}},{id:"4.5",domain:"prompting",title:"Batch processing",simple:"The Message Batches API processes lots of requests in the background for about half the price. Results can take up to 24 hours, so use it only when nobody is waiting.",analogy:"Like sending laundry out: cheaper than doing it now, but you get it back later, not in five minutes.",points:["About 50% cheaper than normal requests.","Can take up to 24 hours, with no speed guarantee.","Good for overnight reports and weekly audits. Bad for checks a developer is waiting on, such as pre-merge reviews.","Give each request a `custom_id`, and match results by it, because they don't come back in order.","A batch request can't do a multi-turn tool loop inside itself."],example:"A nightly job that summarises 10,000 support tickets: use batches. A check that blocks a pull request from merging: use normal requests.",remember:"Cheap but slow. Use it when nobody's waiting.",check:{q:"Which job suits the Batches API?",options:["A pre-merge check developers wait on","An overnight report on 10,000 tickets","A live chat reply"],answer:1,why:"Batches are cheap but can take up to 24 hours."}},{id:"4.6",domain:"prompting",title:"Getting a second opinion",simple:"Claude reviewing its own work in the same conversation often misses its own mistakes. A separate, fresh instance catches more.",analogy:"It's hard to spot typos in your own essay. A friend reading it fresh spots them right away.",points:["Use an independent reviewer instance that didn't write the code.","Split big reviews: one pass per file for local issues, plus one pass for how files work together.","Ask the reviewer to report its confidence for each finding, to help decide what a person should look at first."],example:"Code written in one session is reviewed by a new session that only sees the code and the review instructions.",remember:"Fresh eyes catch more. Use a separate reviewer.",check:{q:"Why use a separate Claude instance to review code?",options:["It's cheaper","The writer tends to miss its own mistakes","It's required by law"],answer:1,why:"A fresh reviewer isn't anchored to the original reasoning."}},{id:"5.1",domain:"context",title:"Keeping important facts in view",simple:"In long conversations, details can get lost or blurred. Keep a short, clear list of key facts (names, numbers, dates) that stays in every request.",analogy:"Like a sticky note on your monitor with the important numbers, so you don't have to dig through old emails.",points:["Keep a 'case facts' block (order numbers, amounts, dates, what the customer said) and don't let summaries blur it.","Models pay most attention to the start and end of long inputs. Things in the middle get missed (the 'lost in the middle' effect).","Put key findings at the start of long inputs.","Trim long tool results down to the fields that matter before adding them to the conversation.","Helper agents should return structured results with dates, sources and method notes."],example:"A customer mentions three order numbers early on. By turn 20 the agent has mixed them up. A case facts block at the top fixes it.",remember:"Write key facts down and put them at the top.",check:{q:"Where should key findings go in a long input?",options:["In the middle","At the start","Nowhere"],answer:1,why:"The start and end get the most attention."}},{id:"5.2",domain:"context",title:"When to hand off to a person",simple:"A good agent knows when a human should take over. Use clear rules for this, not the agent's feelings or the customer's mood.",analogy:"A substitute teacher calls the head teacher for anything outside the lesson plan, instead of making up new school rules.",points:["If a customer asks for a human, hand off right away, without trying one more thing first.","Escalate when the policy doesn't cover the situation, such as a price-match against a competitor.","Don't use sentiment (how upset someone sounds) as the trigger. It doesn't match how hard the problem is.","Don't trust the agent's own confidence score as the trigger either. It's often wrong.","If a search finds several matching customers, ask for more details instead of guessing."],example:"A customer writes 'Just let me speak to a person.' The agent hands off immediately with a short summary.",remember:"Clear rules decide handoffs. Asked for a human? Hand off now.",check:{q:"A customer says 'I want a human.' What should the agent do?",options:["Try to solve it once more first","Hand off immediately","Ask how upset they are"],answer:1,why:"Honour explicit requests for a person right away."}},{id:"5.3",domain:"context",title:"Handling errors across agents",simple:"When a helper agent hits a problem, it should report what happened clearly, so the coordinator can decide what to do. Hiding errors or crashing everything are both bad.",analogy:"If you can't find a library book, tell your group 'that book was checked out, but I found two others' instead of saying nothing.",points:["Report the failure type, what was tried, any partial results, and possible alternatives.","Let helpers handle small, recoverable problems themselves, like one retry after a timeout.","Never return an empty result as if it were a success. That hides the problem.","Don't stop the whole workflow because one helper failed.","In the final report, note which parts are well supported and which have gaps."],example:"One search helper times out. It returns 'timeout searching news; tried twice; here are 3 partial results', and the final report marks that section as lower coverage.",remember:"Report failures clearly. Don't hide them, don't crash.",check:{q:"A helper's search fails. What should it return?",options:["An empty list as if nothing was found","A structured error with what was tried and partial results","Nothing, then stop the whole system"],answer:1,why:"Clear error details let the coordinator recover sensibly."}},{id:"5.4",domain:"context",title:"Working in big codebases",simple:"Big codebases don't fit comfortably in one conversation. Save notes to files, send helpers to explore, and summarise between steps.",analogy:"When studying a thick textbook, you write chapter summaries instead of rereading the whole book every time.",points:["Keep a scratchpad file of findings so they survive even if the conversation is trimmed.","Send helper agents to explore specific questions, keeping the main conversation focused.","Summarise each phase before starting the next.","Keep a manifest (a list of what's done) so work can restart after a crash.","Use `/compact` to shrink a long conversation while keeping the important parts."],example:"During a long investigation, Claude starts giving vague answers about classes it found earlier. Writing key findings to a scratchpad file and using subagents fixes it.",remember:"Write notes to files. Delegate exploring. Compact when full.",check:{q:"In a long session, answers become vague about earlier findings. What helps?",options:["Keep going","Save key findings to a scratchpad file and delegate exploring","Restart without notes"],answer:1,why:"Notes in files survive, and helpers keep the main context clean."}},{id:"5.5",domain:"context",title:"Human review and confidence",simple:"A high overall accuracy number can hide weak spots. Check accuracy for each kind of document and each field, and send uncertain cases to people.",analogy:"A class average of 90% can hide one student who is failing. Look at each student, not just the average.",points:["97% overall can hide poor results on one document type. Measure per document type and per field.","Use stratified sampling: check a fair sample from every type, not just a random handful.","Calibrate confidence scores against examples where you know the right answer.","Send low-confidence or unclear cases to a human reviewer."],example:"Extraction is 97% accurate overall but only 60% on handwritten forms. Those forms get routed to human review.",remember:"Averages hide problems. Check each type and field.",check:{q:"Overall accuracy is 97%. Why might that be misleading?",options:["It can hide a document type that performs badly","97% is always perfect","Accuracy can't be measured"],answer:0,why:"Breaking results down by type reveals weak spots."}},{id:"5.6",domain:"context",title:"Showing where facts come from",simple:"Every important claim should keep a link to its source, all the way into the final report. When sources disagree, show both instead of quietly picking one.",analogy:"In a school report you cite your sources. If two books disagree, you mention both and their dates.",points:["Keep a claim-to-source mapping: the claim, the URL or document, a short quote, and the date.","Make sure sources survive when helpers' results are combined and summarised.","If two sources give different numbers, include both with their sources.","Dates explain many disagreements, such as an old figure versus a new one.","Show each kind of content the right way: numbers in tables, news as text."],example:"One report says market size is $4B (2024) and another says $6B (2026). The final report shows both, with sources and dates.",remember:"Every claim keeps its source. Disagreements are shown, not hidden.",check:{q:"Two sources give different numbers. What should the report do?",options:["Pick the bigger one","Show both, with sources and dates","Leave the number out without saying why"],answer:1,why:"Showing both with provenance lets readers judge."}}];var T=[{id:"q1",domain:"agentic",lesson:"1.1",scenario:"Customer support agent",q:"Your support agent sometimes stops halfway through a task, and sometimes keeps calling tools after it has already answered. The loop currently stops when Claude's text contains the word 'done'. What should you change?",options:["Stop when stop_reason is end_turn, and keep looping while it is tool_use","Search for more words, such as 'finished' and 'complete'","Always stop after exactly 5 loops","Ask Claude to end every message with 'DONE'"],answer:0,why:["Right. stop_reason is the reliable signal: tool_use means run the tool and continue, end_turn means finished.","More keywords is still guessing from text, which is unreliable.","A fixed count cuts long tasks short and wastes calls on short ones. Caps are only a safety net.","This still relies on text, and the model may not always follow it."]},{id:"q2",domain:"agentic",lesson:"1.2",scenario:"Multi-agent research system",q:"A research coordinator is asked about 'AI's effect on creative industries'. Every report covers only visual art and misses music, writing and film. Each helper agent does its own slice well. What is the most likely cause?",options:["The search helper's tool is broken","The coordinator split the topic too narrowly, so whole areas were never assigned","The writing helper's summary is too short","The model is too small for research"],answer:1,why:["The helpers' work is fine for what they were given, so a broken tool doesn't explain the missing topics.","Right. If the coordinator's breakdown leaves areas out, no helper ever looks at them.","A short summary can't explain topics that were never researched at all.","The pattern points to how the work was divided, not model size."]},{id:"q3",domain:"agentic",lesson:"1.3",scenario:"Multi-agent research system",q:"Your synthesis helper writes reports that ignore findings from the search helper, even though the coordinator saw those findings. What is the fix?",options:["Give the synthesis helper web search so it can find them again","Tell the synthesis helper to 'remember earlier results'","Have the coordinator include the search findings, with sources, directly in the synthesis helper's prompt","Run the synthesis helper first"],answer:2,why:["This repeats work and gives the helper a tool outside its role.","Helpers don't inherit the coordinator's conversation. There is nothing for it to remember.","Right. Helpers only know what's in their instructions, so pass the context explicitly.","Order doesn't help if the findings are never passed along."]},{id:"q4",domain:"agentic",lesson:"1.4",scenario:"Customer support agent",q:"Logs show your agent processed refunds without verifying the customer's identity in 8% of cases, despite a clear instruction in the system prompt. What is the most reliable fix?",options:["Put the instruction in capital letters and repeat it three times","Add a code check that blocks process_refund until get_customer has returned a verified ID","Add more examples of verification to the prompt","Lower the refund limit"],answer:1,why:["Stronger wording may help a bit, but prompts are never 100% reliable.","Right. A programmatic gate enforces the order every single time.","Examples improve the odds but still don't guarantee compliance.","This changes the risk size, not whether verification happens."]},{id:"q5",domain:"agentic",lesson:"1.5",scenario:"Customer support agent",q:"Your backend tools return dates in three different formats, and Claude sometimes compares them wrongly. Where is the best place to fix this?",options:["A PostToolUse hook that converts every date to one format before Claude sees it","A system prompt line explaining all three formats","A PreToolUse hook that blocks tools returning odd dates","Ask customers to type dates the same way"],answer:0,why:["Right. Post-tool hooks clean up results reliably, every time.","This relies on Claude interpreting correctly every time, which is what's failing.","Pre-tool hooks run before the call, so they can't see the returned data, and blocking tools breaks the agent.","The dates come from your backend, not from customers."]},{id:"q6",domain:"agentic",lesson:"1.6",scenario:"Claude Code in CI/CD",q:"Automated reviews of a 14-file pull request are shallow and inconsistent: detailed on some files, nearly empty on others. What is the best restructure?",options:["Send all 14 files in one bigger prompt with 'be thorough'","Only review the files with the most changes","Review each file in its own pass, then run one integration pass across files","Switch to the Batches API"],answer:2,why:["One huge pass is what's causing the uneven attention.","Skipping files means missing bugs in them.","Right. Focused per-file passes plus a cross-file pass give deep, consistent coverage.","Batches change cost and speed, not review quality, and are too slow for pull request checks."]},{id:"q7",domain:"tools",lesson:"2.1",scenario:"Customer support agent",q:"Your agent often calls get_customer when it should call lookup_order. Both descriptions say 'Retrieves information'. What should you do first?",options:["Merge the two tools into one","Rewrite both descriptions to say what each accepts, returns, and when to use it","Add a routing classifier in front of the agent","Remove lookup_order"],answer:1,why:["Merging may be useful later, but it's a bigger change than needed.","Right. Descriptions are the main thing Claude uses to choose. Fix them first: low effort, high impact.","This adds complexity without fixing the real cause.","Removing a needed tool breaks order lookups."]},{id:"q8",domain:"tools",lesson:"2.2",scenario:"Customer support agent",q:"When a refund exceeds policy, your MCP tool returns 'Operation failed'. Claude keeps retrying it. What should the tool return?",options:["Nothing, so Claude moves on","A success message so the conversation continues","isError: true with a 'business' error category, isRetryable: false, and a customer-friendly explanation","A longer 'Operation failed' message"],answer:2,why:["Every tool call needs a result. Silence leaves Claude confused.","Faking success tells the customer something false.","Right. A clear category and retry flag tell Claude to stop retrying and explain to the customer.","Length doesn't help. Claude needs the type of failure and whether to retry."]},{id:"q9",domain:"tools",lesson:"2.2",scenario:"Multi-agent research system",q:"A search tool returns an empty list both when nothing matches and when the database is down. What problem does this cause?",options:["None; both mean no data","Claude can't tell a real 'no results' apart from a failure, so it may report 'nothing found' when the search never ran","The tool becomes slower","It uses more tokens"],answer:1,why:["They mean very different things: one is an answer, the other is a failure.","Right. Access failures should be errors; valid empty results should be successes.","Speed isn't the issue.","Token use isn't the issue."]},{id:"q10",domain:"tools",lesson:"2.3",scenario:"Multi-agent research system",q:"Your synthesis helper has 18 tools, including web search and file editing, and often calls tools it doesn't need. What's the best fix?",options:["Give it only the few tools its job needs","Add 'only use relevant tools' to its prompt","Give it even more tools so it has options","Use a bigger model"],answer:0,why:["Right. Fewer, role-matched tools improve selection. Around 4 to 5 per agent works well.","A prompt nudge doesn't fix the confusing toolset.","More tools makes selection worse.","A bigger model doesn't fix a badly scoped toolset."]},{id:"q11",domain:"tools",lesson:"2.4",scenario:"Developer productivity",q:"Your team wants everyone's Claude Code to connect to the company's GitHub MCP server, without committing anyone's personal token. How?",options:["Each person adds it to ~/.claude.json with their token","Put it in .mcp.json with the token typed in","Put it in the project's .mcp.json using ${GITHUB_TOKEN}, and each person sets the environment variable","Paste the token in CLAUDE.md"],answer:2,why:["This works, but every person must set it up separately, so it isn't shared.","This commits a secret to version control.","Right. Shared config, with secrets kept out through environment variable expansion.","Never put secrets in memory files."]},{id:"q12",domain:"tools",lesson:"2.5",scenario:"Developer productivity",q:"You join a new codebase and must find every place that calls processPayment(). Which approach is best?",options:["Read every file one by one","Use Grep to search file contents for processPayment, then Read only the matching files","Use Glob for **/*processPayment*","Ask Claude to guess from the folder names"],answer:1,why:["This wastes time and context on irrelevant files.","Right. Grep finds content; then Read just what matters.","Glob matches file names, not the code inside files.","Guessing misses calls."]},{id:"q13",domain:"claudecode",lesson:"3.1",scenario:"Code generation with Claude Code",q:"A new developer says Claude Code ignores your team's coding rules on their machine. On your machine it follows them. What is the most likely cause?",options:["The rules are in your user-level ~/.claude/CLAUDE.md, which isn't shared","Their internet is slow","They need a newer laptop","CLAUDE.md only works for the first person who creates it"],answer:0,why:["Right. User-level memory stays on your machine. Team rules belong in the project CLAUDE.md.","Connection speed doesn't affect which memory files load.","Hardware isn't related.","A project CLAUDE.md works for everyone who has the repo."]},{id:"q14",domain:"claudecode",lesson:"3.1",scenario:"Code generation with Claude Code",q:"Claude Code seems to ignore an instruction you think is in CLAUDE.md. What's the best first diagnostic step?",options:["Reinstall Claude Code","Run /memory to see which memory files are actually loaded","Rewrite the instruction in capital letters","Delete CLAUDE.md"],answer:1,why:["Reinstalling is slow and rarely the cause.","Right. /memory shows exactly which files are loaded, so you can see if yours is missing.","If the file isn't loaded, wording won't matter.","Deleting removes all your rules."]},{id:"q15",domain:"claudecode",lesson:"3.3",scenario:"Code generation with Claude Code",q:"Test files live next to the code they test, across dozens of folders. You want one testing style guide applied only when Claude edits a test file. What should you use?",options:["A CLAUDE.md in every folder","Put the guide in the root CLAUDE.md",'A file in .claude/rules/ with paths: ["**/*.test.*"] in its frontmatter',"A slash command developers must remember to run"],answer:2,why:["Dozens of copies are hard to maintain.","This loads the guide for every task, wasting context and risking confusion.","Right. Path-scoped rules load only when matching files are edited, wherever they live.","People forget. Rules should apply automatically."]},{id:"q16",domain:"claudecode",lesson:"3.4",scenario:"Code generation with Claude Code",q:"You need to move a monolith to microservices. It will touch dozens of files and there are several possible designs. How should you start?",options:["Direct execution, and fix problems as they come up","Plan mode, to explore and agree on an approach before changing code","Ask Claude to do it all in one message without planning","Split it into 50 tiny unrelated prompts"],answer:1,why:["Large, multi-option changes done directly often need costly rework.","Right. Plan mode suits big, architectural, multi-file work.","This is direct execution under another name.","Unrelated prompts lose the overall design."]},{id:"q17",domain:"claudecode",lesson:"3.6",scenario:"Claude Code in CI/CD",q:`Your CI pipeline runs claude "Review this PR" and the job hangs until it times out. What's the fix?`,options:["Add the -p flag so Claude Code runs non-interactively","Give the job more memory","Add a longer timeout","Put the instruction in CLAUDE.md"],answer:0,why:["Right. Without -p (print mode), Claude Code waits for interactive input.","Memory isn't the problem.","It would just hang longer.","CLAUDE.md adds context but doesn't change interactive mode."]},{id:"q18",domain:"claudecode",lesson:"3.2",scenario:"Developer productivity",q:"Your team wants a /review command with the same checklist for everyone, kept in version control. Where should it go?",options:["~/.claude/commands/review.md on each laptop",".claude/commands/review.md in the project repository","In the system prompt of each developer's terminal","In a shared chat channel"],answer:1,why:["Personal commands aren't shared or versioned with the project.","Right. Project commands are committed and available to everyone who clones the repo.","There's no such shared place, and it wouldn't be a slash command.","Chat messages aren't loaded by Claude Code."]},{id:"q19",domain:"prompting",lesson:"4.1",scenario:"Claude Code in CI/CD",q:"Developers stopped trusting your automated reviewer because it flags many harmless things. The prompt says 'Be conservative and only report important issues.' What is the best change?",options:["Add 'be VERY conservative'","Spell out exactly which issues to report (bugs, security) and which to skip (style, naming)","Ask for confidence scores and hide anything below 50%","Review fewer files"],answer:1,why:["Vague instructions stay vague, however strongly they're worded.","Right. Specific, categorical criteria cut false positives.","Self-reported confidence is poorly calibrated, so filtering on it is unreliable.","Fewer files means missed bugs, not better precision."]},{id:"q20",domain:"prompting",lesson:"4.2",scenario:"Structured data extraction",q:"Your extractor handles standard invoices well but keeps misreading invoices with handwritten corrections. What's the most effective improvement?",options:["Add 2 to 4 examples of corrected invoices, with the right output and why","Add 20 examples of standard invoices","Tell it to 'pay attention to handwriting'","Remove handwritten invoices from the dataset"],answer:0,why:["Right. Targeted few-shot examples teach the tricky cases.","More easy examples don't teach the hard case.","A vague instruction doesn't show what correct looks like.","The business still needs those invoices processed."]},{id:"q21",domain:"prompting",lesson:"4.3",scenario:"Structured data extraction",q:"About 15% of contracts have no renewal date, but your extractor always returns one, often invented. The schema marks renewal_date as required. What fixes this?",options:["Make renewal_date nullable so 'not present' is a valid answer","Remove the schema","Add 'never make things up' to the prompt","Default missing dates to January 1"],answer:0,why:["Right. A required field pushes the model to fill it. Allowing null gives an honest option.","Removing the schema brings back format errors.","Instructions help less than a schema that allows the truthful answer.","A default date is still a made-up value."]},{id:"q22",domain:"prompting",lesson:"4.4",scenario:"Structured data extraction",q:"Validation finds that the extracted line items don't add up to the stated total. What is the best retry?",options:["Send the same request again","Send the original document, the failed extraction, and the specific mismatch","Send only the error message","Keep retrying until the numbers match"],answer:1,why:["An identical request tends to give the same result.","Right. Specific feedback with full context lets Claude find and fix the error.","Without the document, Claude can't check what's actually there.","If the source itself is inconsistent, retries will never match. Route it to a person."]},{id:"q23",domain:"prompting",lesson:"4.5",scenario:"Claude Code in CI/CD",q:"Your team runs two jobs: a pre-merge check that developers wait on, and a weekly code-quality report. Someone suggests moving both to the Batches API to save money. What should you do?",options:["Move both, since 50% savings is worth it","Move only the weekly report; keep the pre-merge check on normal requests","Move only the pre-merge check","Move neither"],answer:1,why:["Batches can take up to 24 hours, which would block developers.","Right. Batches suit work nobody waits on. Blocking checks need fast responses.","This is backwards: the waiting job is the one that can't be slow.","The weekly report is a perfect fit for batch savings."]},{id:"q24",domain:"prompting",lesson:"4.6",scenario:"Code generation with Claude Code",q:"Code written by Claude is reviewed by asking the same session 'please review what you wrote'. It rarely finds problems that humans later catch. What should change?",options:["Ask it to review three times","Use a separate, fresh Claude instance as the reviewer","Turn reviews off","Ask it to be harsher"],answer:1,why:["The same session tends to repeat its own reasoning.","Right. An independent reviewer isn't anchored to the original choices.","That throws away a useful safety check.","Tone doesn't remove the blind spot."]},{id:"q25",domain:"context",lesson:"5.1",scenario:"Customer support agent",q:"In long support chats, your agent starts mixing up the customer's order numbers and refund amounts after many turns. What helps most?",options:["Summarise the whole conversation every 5 turns","Keep a 'case facts' block (IDs, amounts, dates) included at the top of every request","Shorten the system prompt","End chats after 10 turns"],answer:1,why:["Summaries tend to blur exact numbers and IDs.","Right. A persistent, exact facts block keeps key details clear.","The system prompt isn't the cause.","Cutting chats short hurts customers."]},{id:"q26",domain:"context",lesson:"5.2",scenario:"Customer support agent",q:"A customer writes: 'This is the third time. I just want to talk to a human.' The agent believes it could solve the issue. What should it do?",options:["Try one more solution first, since it's confident","Hand off to a human immediately, with a summary of the case","Check the customer's sentiment score first","Ask why they want a human"],answer:1,why:["Ignoring a direct request damages trust, and the agent's confidence is not a reliable guide.","Right. Explicit requests for a human are honoured right away.","Sentiment isn't the right trigger. The customer has asked directly.","Questioning the request delays the handoff the customer asked for."]},{id:"q27",domain:"context",lesson:"5.2",scenario:"Customer support agent",q:"A lookup by name returns three customers called 'Alex Kim'. What should the agent do?",options:["Pick the most recent customer","Ask the customer for another detail, such as email or order number, to identify the right account","Escalate to a human immediately","Merge the three accounts"],answer:1,why:["Guessing risks exposing or changing the wrong person's account.","Right. When several records match, ask for an identifier.","This is easy to resolve, so a human isn't needed.","Merging accounts is destructive and wrong."]},{id:"q28",domain:"context",lesson:"5.3",scenario:"Multi-agent research system",q:"One search helper times out. Right now it returns an empty result marked as success, and the final report confidently says 'no news coverage found'. What should happen instead?",options:["Stop the whole research workflow","The helper returns a structured error (type, what it tried, any partial results), and the report notes the gap","Hide the section from the report","Retry forever until it works"],answer:1,why:["One failed helper shouldn't stop everything.","Right. Clear error context lets the coordinator recover, and readers see what's less certain.","Hiding gaps misleads readers.","Endless retries waste time. Retry a little locally, then report."]},{id:"q29",domain:"context",lesson:"5.5",scenario:"Structured data extraction",q:"Extraction accuracy is 97% overall, so the team wants to stop human review. What should you check first?",options:["Nothing; 97% is excellent","Accuracy by document type and by field, using a stratified sample","Whether the model is the newest","How fast extraction runs"],answer:1,why:["A high average can hide one document type that fails badly.","Right. Breaking accuracy down shows where human review is still needed.","Model version doesn't tell you where errors are.","Speed isn't accuracy."]},{id:"q30",domain:"context",lesson:"5.6",scenario:"Multi-agent research system",q:"Two trusted sources give different market sizes: $4B (2024) and $6B (2026). How should the final research report handle this?",options:["Use the bigger number","Average them to $5B","Show both figures with their sources and dates","Leave the market size out"],answer:2,why:["Picking one hides real disagreement.","An average matches neither source and has no provenance.","Right. Annotate conflicts with sources; the dates explain much of the difference.","Dropping the figure removes useful information."]}];var Me=[{id:"golden-rules",title:"The 5 Golden Rules",subtitle:"The Architect's Cheat Sheet: the agent loop",style:"rules",lesson:"1.1",items:[{text:"`end_turn` is the ONLY valid loop exit.",means:"Stop the loop only when stop_reason is end_turn."},{text:"`tool_use` means execute and continue.",means:"Run the requested tool, send the result back, and call Claude again."},{text:"Always append assistant first, then user.",means:"Add Claude's reply (with its tool_use blocks) to the history, then a user message with the tool_result blocks."},{text:"`tool_use_id` must perfectly match.",means:"Each tool_result must carry the exact id of the tool_use it answers."},{text:"The API is stateless; send the full history.",means:"Claude remembers nothing between calls, so every request includes the whole conversation."}]},{id:"anti-patterns",title:"The 3 Anti-Patterns to Spot on Exams",subtitle:"If an answer option does one of these, it's probably wrong",style:"warnings",lesson:"1.1",items:[{text:"Parsing words \u2192 Causes crashes.",means:"Deciding the loop is done by reading Claude's text for words like 'done'."},{text:"Iteration cap \u2192 Cuts off early.",means:"Stopping after a fixed number of loops instead of on end_turn."},{text:"Text content check \u2192 Drops tools silently.",means:"Treating any reply that contains text as final, which skips tool calls in the same reply."}]},{id:"domain1-architecture",title:"Domain 1 Architecture Cheat Sheet",subtitle:"Concept \xB7 the hard rule \xB7 exam diagnostic (why it matters)",style:"table",lesson:"1.2",items:[{concept:"Topology",rule:"All communication routes through the coordinator.",diagnostic:"Enables absolute observability."},{concept:"Task Tool",rule:"Coordinator needs it; Subagents don't.",diagnostic:"Prevents recursive delegation loops."},{concept:"Parallel Spawning",rule:"Multiple Task calls in ONE response.",diagnostic:"Fixes 3x latency issues."},{concept:"Context Isolation",rule:"Subagents inherit zero history.",diagnostic:"Always explicitly inject context."},{concept:"Siloed Outputs",rule:"Usually caused by overly narrow decomposition.",diagnostic:"Pipeline is missing a synthesis/aggregation step."}]},{id:"quick-reference",title:"Quick Reference Card",subtitle:"Concept \xB7 key exam fact \xB7 task statement",style:"table",items:[{concept:"Prompt Instructions",rule:"Probabilistic. Non-zero failure.",task:"1.4"},{concept:"PostToolUse Hook",rule:"Normalization window. Runs before model sees result.",task:"1.5"},{concept:"PreToolUse Hook",rule:"Can block call entirely.",task:"1.5"},{concept:"Prerequisite Gate",rule:"Blocks Tool B until Tool A verified. Programmatic.",task:"1.4"},{concept:"Handoff Summary",rule:"Self-contained context without conversation transcript.",task:"1.4"},{concept:"Prompt Chaining",rule:"Fixed steps. Known upfront. Predictable tasks.",task:"1.6"},{concept:"Dynamic Decomposition",rule:"Steps from discoveries. Open-ended tasks.",task:"1.6"}]},{id:"distractor-patterns",title:"Distractor Patterns to Reject",subtitle:"Answer options that sound right but aren't",style:"warnings",items:[{text:"Add stronger prompt instructions \u2192 Always wrong for guaranteed enforcement.",means:"Prompts are probabilistic. If something must always happen, use a hook or a prerequisite gate in code."},{text:"Add few-shot examples \u2192 Correct for consistency, NOT for compliance.",means:"Examples make output format steadier, but they can't force the model to follow a rule every time."},{text:"Pre-define all steps \u2192 Wrong for open-ended tasks with unknown scope.",means:"When you can't know the steps upfront, let the agent decompose dynamically from what it discovers."}]}];var ia=[{id:"mock1",title:"Mock 1",minutes:60,questions:[{domain:"agentic",lesson:"1.5",scenario:"Customer support agent",q:"Company policy says refunds over $500 must be approved by a person. The system prompt states this rule clearly, yet audits show the agent processed several $600\u2013$900 refunds on its own last month. What is the most reliable fix?",options:["Add a hook on process_refund that blocks amounts over $500 and routes the case to escalate_to_human","Repeat the $500 rule at the start and end of the system prompt, in capital letters","Add several few-shot examples to the system prompt that show the agent escalating refunds above $500 instead of processing them itself","Run a nightly audit job that reverses refunds over $500 and emails the customer"],answer:0,why:["Right. A hook on the outgoing tool call is deterministic: the refund physically can't go through, and the case is redirected to the correct workflow.","Still prompt-based. Prompt instructions are probabilistic and keep a non-zero failure rate, which is not acceptable for a financial rule.","Few-shot examples improve consistency but cannot guarantee compliance. Some large refunds would still slip through.","This detects the violation after the money has moved and creates a bad customer experience. Prevent it instead of cleaning up."]},{domain:"tools",lesson:"2.2",scenario:"Customer support agent",q:`Your lookup_order MCP tool returns the same response, {"error": "Operation failed"}, for timeouts, badly formatted order numbers, and orders that belong to a different customer. The agent retries bad order numbers again and again, and tells some customers to 'try later' when they don't have permission. What should you change?`,options:["Raise the agent's retry limit so that temporary failures have more chances to succeed","Return isError with structured metadata: an error category (transient, validation, permission), an isRetryable flag, and a readable description","Tell the agent in the system prompt never to retry a failed tool call","Return an empty result instead of an error for every failure, so the agent can tell the customer politely that no matching order was found and move on"],answer:1,why:["More retries make the problem worse: validation and permission errors will never succeed no matter how often you retry.","Right. Structured error categories and a retryable flag let the agent choose the right recovery: retry timeouts, ask the customer to fix the number, and explain permission problems.","This stops useful retries for genuine timeouts. The agent needs to tell error types apart, not follow one blanket rule.","This hides a failure as a valid 'no match' result, which is misleading. Access failures and empty results must stay distinguishable."]},{domain:"context",lesson:"5.1",scenario:"Customer support agent",q:"In long support chats, older turns are summarized to save tokens. After summarization the agent tells a customer 'your refund of around $80 should arrive soon', even though the customer said $87.43 and was promised it by Friday. What is the best fix?",options:["Summarize the history more often so each summary is shorter and fresher","Ask customers to repeat their order details whenever the conversation gets long","Extract key transactional facts (amounts, dates, order IDs, promises) into a persistent case-facts block that is sent with every request, outside the summarized history","Turn off summarization entirely and always send the complete raw transcript, so no detail can ever be lost, however long the conversation gets"],answer:2,why:["Summarizing more often compresses the numbers even more. Progressive summarization is exactly what blurs exact values and dates.","This shifts the burden onto the customer and hurts the experience. The system already had the facts and lost them.","Right. Exact facts live in a structured block that is never summarized, so they stay precise however long the chat runs.","This works until the context limit, and very long inputs bring 'lost in the middle' problems. A case-facts block solves the real issue."]},{domain:"tools",lesson:"2.1",scenario:"Customer support agent",q:"The agent has two tools: process_refund ('Gives the customer money back') and issue_store_credit ('Gives the customer value back'). Logs show it often issues store credit when customers clearly asked for a refund to their card. What is the best first step?",options:["Merge both into a single compensate_customer tool with a required 'method' parameter (refund or credit), so there is only one tool to choose","Add a keyword router that sends any message containing 'refund' straight to process_refund","Rewrite both descriptions to say what each does, its inputs, and when to use it instead of the other","Add a line to the system prompt telling the agent to think carefully about which compensation the customer asked for before choosing a tool"],answer:2,why:["Merging is a bigger redesign and just moves the same ambiguity into a parameter. Fix the descriptions first.","A keyword router is brittle and bypasses the model's understanding. 'I don't want a refund, just credit' would be misrouted.","Right. Tool descriptions are the main signal Claude uses to choose tools. Near-identical descriptions cause misrouting; clear boundaries fix it.","A vague instruction doesn't give the model any new information to tell the tools apart."]},{domain:"context",lesson:"5.2",scenario:"Customer support agent",q:"A customer gives their name, 'Maria Lopez'. get_customer returns three accounts with that name in the same city. What should the agent do?",options:["Pick the account with the most recent order activity, since statistically that is most likely to be the account the customer is contacting support about","Ask the customer for another identifier, such as their email or an order number","Pick the account that has an open support ticket","Continue with all three accounts and apply any change to each of them"],answer:1,why:["A heuristic guess can expose or change the wrong person's account. Never choose between multiple matches by guessing.","Right. Multiple matches call for clarification with an extra identifier, not heuristic selection.","Still a guess. An open ticket does not prove which account belongs to this customer.","Changing three accounts when only one is correct is a serious data and privacy error."]},{domain:"agentic",lesson:"1.4",scenario:"Customer support agent",q:"When the agent escalates, human agents complain they have to start from scratch: they can't see the chat transcript and don't know what was already tried. What should the escalation include?",options:["A one-line note: 'Customer needs help with an order issue'","A link to the full conversation logs in the internal logging system, so the human agent can read the entire transcript and understand everything that happened","Nothing extra. The human should ask the customer to explain the problem again so nothing is missed","A structured handoff summary: customer ID, the issue and its root cause, what was already checked or attempted, amounts involved, and a recommended next action"],answer:3,why:["Too vague. The human still has to rediscover everything.","Human agents may not have access to those logs, and reading a long transcript is slow. A handoff should be self-contained.","Making the customer repeat themselves is exactly the experience you are trying to avoid.","Right. A self-contained structured summary lets someone without the transcript act immediately."]},{domain:"agentic",lesson:"1.4",scenario:"Customer support agent",q:"A customer writes one message with three problems: a damaged blender, a double charge on last month's bill, and a wrong delivery address on an open order. The agent fixes the blender and ends the conversation. What design change best handles messages like this?",options:["Have the agent first split the message into distinct issues, investigate each one (in parallel where possible) using shared customer context, then reply with one combined resolution","Ask customers to open a separate ticket for each problem","Only handle the most urgent issue, then ask if there is anything else","Escalate any message that mentions more than one issue to a human agent, since multi-issue conversations are complex and carry a higher risk of mistakes"],answer:0,why:["Right. Decompose multi-concern requests into separate items, investigate each, and synthesize a single resolution.","This pushes work back onto the customer and hurts first-contact resolution.","Handling one issue and hoping the customer asks again is what is failing now.","Multiple issues are not the same as complex issues. Escalating all of them would wreck the 80% resolution target."]},{domain:"tools",lesson:"2.3",scenario:"Customer support agent",q:"Your support agent has access to 19 tools, including internal admin and reporting tools it rarely needs. Tool selection is unreliable: it sometimes calls the wrong tool or a tool from the wrong area. Which TWO changes will most improve tool selection? (Choose 2.)",options:["Reduce the agent's tools to the handful its support role actually needs",'Set tool_choice to "any" on every turn',"Make the descriptions of overlapping tools clearly different, with when-to-use guidance","Increase the sampling temperature so the agent explores more tools","Add the instruction 'choose tools carefully' to the system prompt"],answer:[0,2],why:["Correct. Too many tools increases decision complexity and degrades selection. Give each agent only what its role needs.",'"any" forces some tool call on every turn, which breaks normal replies and does nothing to help pick the right tool.',"Correct. Clear, differentiated descriptions are the main lever for choosing the right tool.","Higher temperature adds randomness, which makes selection less reliable, not more.","Vague instructions add no information the model can use to tell tools apart."]},{domain:"claudecode",lesson:"3.1",scenario:"Code generation with Claude Code",q:"A senior developer's Claude Code always follows the team's testing conventions, but a new hire's doesn't, even on the same repository. The conventions are written in the senior developer's ~/.claude/CLAUDE.md. What is the right fix?",options:["Ask the new hire to copy the senior developer's ~/.claude/CLAUDE.md onto their own machine so both developers have identical instructions loaded","Move the conventions into the project's CLAUDE.md (or .claude/rules/) and commit it to the repository","Have the new hire run /compact before each session","Add the conventions to .mcp.json so they are shared with the MCP servers"],answer:1,why:["This works once but drifts over time and has to be repeated for every new person. User-level files are personal.","Right. User-level CLAUDE.md is not shared through version control. Team standards belong in project-level configuration.","/compact shrinks the current context. It doesn't load instructions that were never there.",".mcp.json configures MCP servers, not coding conventions."]},{domain:"claudecode",lesson:"3.2",scenario:"Code generation with Claude Code",q:"Your team's /analyze-deps skill scans the whole codebase and prints hundreds of lines of dependency details. After running it, developers find the main conversation cluttered and Claude loses track of the task they were working on. What should you change?",options:["Add allowed-tools to the skill's frontmatter so it can only use read-only tools, which keeps the analysis lightweight and limits what it prints","Add an argument-hint so developers must name a single package, which keeps the analysis small and its output short","Add context: fork to the skill's frontmatter so it runs in an isolated sub-agent","Move the skill's instructions into CLAUDE.md so they are always loaded"],answer:2,why:["allowed-tools limits what the skill can do, but its verbose output would still flood the main context.","This prompts for a parameter but doesn't stop the output from polluting the conversation.","Right. context: fork runs the skill in its own context, so verbose output stays out of the main session.","That loads the instructions into every session, adding clutter instead of removing it."]},{domain:"claudecode",lesson:"3.4",scenario:"Code generation with Claude Code",q:"A bug report includes a clear stack trace pointing to one function that crashes when the 'discount' field is null. The fix is a single null check. How should you approach this in Claude Code?",options:["Enter plan mode and have Claude explore the codebase before proposing anything","Use direct execution: ask Claude to add the null check and a test for it","Launch an Explore subagent to map every caller of the function first, so the fix doesn't break anything elsewhere in the codebase","Use the interview pattern so Claude asks you about edge cases before coding"],answer:1,why:["Plan mode is for large, multi-file or architectural work. Here it adds overhead with no benefit.","Right. A well-scoped, single-function fix with a clear cause is exactly what direct execution is for.","Wide discovery isn't needed when the stack trace already pinpoints the problem.","The interview pattern helps in unfamiliar design spaces, not for a one-line known fix."]},{domain:"claudecode",lesson:"3.5",scenario:"Code generation with Claude Code",q:"You've described in a paragraph how a migration script should reformat phone numbers. Each time, Claude handles some formats differently from what you meant, especially numbers with extensions. What is the most effective way to clarify?",options:["Rewrite the paragraph to be longer and more detailed, describing every phone format and how extensions should be handled in each case","Give 2\u20133 concrete input \u2192 expected output examples, including one with an extension","Tell Claude to 'be precise' and 'follow the description exactly'","Switch to plan mode so Claude thinks harder about the formats"],answer:1,why:["More prose is still open to interpretation, which is the problem you already have.","Right. Concrete input/output examples are the clearest way to communicate a transformation when prose is read inconsistently.","General exhortations don't add the missing information about what you expect.","Plan mode is for designing large changes. It doesn't fix an unclear specification."]},{domain:"claudecode",lesson:"3.5",scenario:"Code generation with Claude Code",q:"You've found three problems in Claude's new caching layer: the cache key ignores the user's locale, invalidation runs before the write commits, and the retry logic re-reads the stale cache. Fixing any one changes how the others should be fixed. How should you give this feedback?",options:["Fix one problem per message, starting with the easiest","Describe all three problems together in one detailed message, explaining how they interact","Start a fresh session for each problem so that each fix gets Claude's full attention with a clean, uncluttered context","Ask Claude to find and fix 'any remaining caching issues' without listing them, so it investigates the whole layer with fresh eyes instead of being anchored"],answer:1,why:["Sequential fixes suit independent problems. Here each fix affects the others, so you would end up redoing work.","Right. When issues interact,
